services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-monitor}
      POSTGRES_USER: ${POSTGRES_USER:-monitor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-monitor}
      # непривилегированная роль для API/воркеров — только с ней RLS реально работает
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-monitor_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-monitor_app}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # создаёт роль приложения при первой инициализации тома
      - ./deploy/postgres-init.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    # без политики перезапуска стек не переживает перезагрузку хоста: приложение
    # (restart: unless-stopped) поднимется и уйдёт в цикл рестартов, а БД останется лежать
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-monitor} -d ${POSTGRES_DB:-monitor}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    # имя узла входит в путь mnesia (rabbit@<hostname>): без фиксации пересозданный
    # контейнер получает новое случайное имя и не видит собственные данные в томе
    hostname: rabbitmq
    environment:
      # guest/guest в проде — учётка по умолчанию, известная всем; она же открывает
      # management UI. Пароль подставляется в RABBITMQ_URL, поэтому берите его
      # без символов, требующих URL-экранирования (@ : / ?)
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      # без тома пересоздание контейнера (обычное `up --build`) стирает mnesia:
      # уходят durable-очереди с неразобранными задачами, содержимое DLQ и политики
      - rabbitmq-data:/var/lib/rabbitmq
      # политика хранения для *.dlq — применяется вручную после первого запуска:
      # docker compose exec rabbitmq sh /rabbitmq-policies.sh
      - ./deploy/rabbitmq-policies.sh:/rabbitmq-policies.sh:ro
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Миграции отдельным одноразовым шагом, а не внутри шедулера. Раньше их гонял
  # шедулер, а он ждал backend (condition: service_started) — то есть API уже
  # принимал трафик, когда схемы ещё не было, и на каждом схемном деплое открывалось
  # окно 500-х. /health при этом в БД не ходит и оставался зелёным.
  # Все, кому нужна схема, теперь ждут завершения этого шага.
  migrate:
    build: ./backend
    command: alembic upgrade head
    environment:
      # суперпользователь БД: владелец миграций и единственный, кому нужен DDL
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-monitor}:${POSTGRES_PASSWORD:-monitor}@postgres:5432/${POSTGRES_DB:-monitor}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-change-me}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: ./backend
    environment:
      # API ходит в БД непривилегированной ролью — иначе RLS обходится суперпользователем
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_APP_USER:-monitor_app}:${POSTGRES_APP_PASSWORD:-monitor_app}@postgres:5432/${POSTGRES_DB:-monitor}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-change-me}
      # development | production: в production запрещены дефолтные JWT-секреты
      ENVIRONMENT: ${ENVIRONMENT:-development}
      # comma-separated список origin'ов фронтенда для CORS
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      # сколько доверенных прокси перед nginx приложения: 0 — nginx смотрит наружу
      # сам, 1 — перед ним TLS-терминатор (Caddy из DEPLOY.md). От этого зависит,
      # какую запись X-Forwarded-For считать адресом клиента в rate-limit
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}
      # Fernet-ключ шифрования секретов (bot token); если пуст — деривируется из JWT_SECRET_KEY
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:-}
      # team (лимиты пользователей/мониторов) | enterprise (без лимитов)
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-team}
      # сколько организаций клиент может создать сам (enterprise): лимиты тарифа
      # считаются на организацию, поэтому без потолка платный план обходится
      # созданием новых бесплатных воркспейсов
      MAX_OWNED_ORGS_PER_USER: ${MAX_OWNED_ORGS_PER_USER:-3}
      # SSRF-защита: false — мониторы не могут вести во внутреннюю сеть (SaaS);
      # true — разрешить приватные адреса (on-prem мониторинг внутренних сервисов)
      ALLOW_PRIVATE_TARGETS: ${ALLOW_PRIVATE_TARGETS:-false}
      # браузерные сценарии: у их воркера нет пиннинга адреса (Chromium резолвит
      # имя сам), поэтому по умолчанию выключены — см. 04-security.md
      BROWSER_MONITORS_ENABLED: ${BROWSER_MONITORS_ENABLED:-false}
      # Sentry DSN; пусто — отключён
      SENTRY_DSN: ${SENTRY_DSN:-}
      # VAPID-ключи для web push (сгенерировать: python -m app.tools.vapid); пусто — push отключён
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
      # SMTP для писем (сброс пароля, email-алерты); пусто — email-канал отключён
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-PWA Monitor <no-reply@localhost>}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      # базовый URL приложения для ссылок в письмах
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5173}
      # платформенные суперадмины (страница /admin): email через запятую; пусто — никто
      SUPERUSER_EMAILS: ${SUPERUSER_EMAILS:-}
    ports:
      - "8000:8000"
    restart: unless-stopped
    # /health отвечает без обращения к БД — это liveness самого процесса;
    # готовность зависимостей проверяет /ready, его дёргает внешний мониторинг
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  scheduler:
    build: ./backend
    command: python -m app.workers.scheduler
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-monitor}:${POSTGRES_PASSWORD:-monitor}@postgres:5432/${POSTGRES_DB:-monitor}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-change-me}
      # нужен шедулеру: в enterprise он применяет мин. интервал тарифа на лету
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-team}
      # шедулер гасит включённые browser-мониторы, когда сценарии выключены
      BROWSER_MONITORS_ENABLED: ${BROWSER_MONITORS_ENABLED:-false}
      SENTRY_DSN: ${SENTRY_DSN:-}
      METRICS_PORT: "9101"
    # /metrics только на localhost хоста — наружу не публикуется
    ports:
      - "127.0.0.1:9101:9101"
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker-http:
    build: ./backend
    command: python -m app.workers.http_worker
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_APP_USER:-monitor_app}:${POSTGRES_APP_PASSWORD:-monitor_app}@postgres:5432/${POSTGRES_DB:-monitor}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-change-me}
      # SSRF-защита: true разрешает мониторить приватные адреса (on-prem)
      ALLOW_PRIVATE_TARGETS: ${ALLOW_PRIVATE_TARGETS:-false}
      # сколько HTTP-проверок воркер ведёт одновременно: при 1 недоступный адрес
      # занимал бы его на весь CHECK_TIMEOUT_SECONDS, останавливая проверки всех
      # мониторов. Проверка ждёт сеть, а не процессор — потолок высокий
      HTTP_CONCURRENCY: ${HTTP_CONCURRENCY:-10}
      CHECK_TIMEOUT_SECONDS: ${CHECK_TIMEOUT_SECONDS:-30}
      SENTRY_DSN: ${SENTRY_DSN:-}
      METRICS_PORT: "9102"
      # нужен воркерам для расшифровки bot token при отправке алертов
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:-}
      # VAPID-ключи для web push (сгенерировать: python -m app.tools.vapid); пусто — push отключён
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
      # SMTP для email-алертов; пусто — email-канал отключён
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-PWA Monitor <no-reply@localhost>}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      # базовый URL приложения для ссылок в письмах
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5173}
    ports:
      - "127.0.0.1:9102:9102"
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker-browser:
    build:
      context: ./backend
      dockerfile: Dockerfile.browser
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_APP_USER:-monitor_app}:${POSTGRES_APP_PASSWORD:-monitor_app}@postgres:5432/${POSTGRES_DB:-monitor}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-change-me}
      # SSRF-защита: true разрешает мониторить приватные адреса (on-prem)
      ALLOW_PRIVATE_TARGETS: ${ALLOW_PRIVATE_TARGETS:-false}
      SENTRY_DSN: ${SENTRY_DSN:-}
      METRICS_PORT: "9103"
      # нужен воркерам для расшифровки bot token при отправке алертов
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:-}
      # браузерных проверок одновременно — каждая держит свой Chromium (память!)
      BROWSER_CONCURRENCY: ${BROWSER_CONCURRENCY:-2}
      # выключено — воркер не поднимает Chromium даже на задачу из очереди
      BROWSER_MONITORS_ENABLED: ${BROWSER_MONITORS_ENABLED:-false}
      CHECK_TIMEOUT_SECONDS: ${CHECK_TIMEOUT_SECONDS:-30}
      # VAPID-ключи для web push (сгенерировать: python -m app.tools.vapid); пусто — push отключён
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
      # SMTP для email-алертов; пусто — email-канал отключён
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-PWA Monitor <no-reply@localhost>}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      # базовый URL приложения для ссылок в письмах
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5173}
    ports:
      - "127.0.0.1:9103:9103"
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  backup:
    image: postgres:16-alpine
    command: sh /backup.sh
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-monitor}
      PGPASSWORD: ${POSTGRES_PASSWORD:-monitor}
      PGDATABASE: ${POSTGRES_DB:-monitor}
      # период между дампами (сутки) и сколько свежих дампов хранить
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
    volumes:
      # дампы на хосте: ./backups — забирайте их на внешнее хранилище
      - ./backups:/backups
      - ./deploy/backup.sh:/backup.sh:ro
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # node_modules живёт в анонимном volume: хостовые (Windows) бинарники
      # esbuild/rollup несовместимы с Linux-контейнером
      - /app/node_modules
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres-data:
  rabbitmq-data:
