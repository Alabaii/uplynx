# Еженедельные PR с обновлениями зависимостей (гигиена перед приёмом денег).
# Мержит владелец после зелёного CI — как обычные PR.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    # git-flow: все изменения через dev, main только под прод
    target-branch: dev
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    # git-flow: все изменения через dev, main только под прод
    target-branch: dev
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    # git-flow: все изменения через dev, main только под прод
    target-branch: dev
    ignore:
      # версия Python меняется осознанно вместе с CI/venv, не автобампом:
      # бамп 3.12→3.14 сломал сборку (greenlet без колёс под новые версии)
      - dependency-name: python

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
    # git-flow: все изменения через dev, main только под прод
    target-branch: dev

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # git-flow: все изменения через dev, main только под прод
    target-branch: dev
