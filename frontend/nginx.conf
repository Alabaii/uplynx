server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/security-headers.conf;

    # API и health-чеки бэкенда — same-origin, путь сохраняется
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /health {
        proxy_pass http://backend:8000;
    }
    # readiness (проверяет доступность БД). Без отдельного location путь уходит
    # в SPA-фолбэк и отдаёт 200 с index.html — проб на него был бы зелёным
    # всегда, включая случай, когда бэкенд не видит базу
    location = /ready {
        proxy_pass http://backend:8000;
    }
    # liveness шедулера (503, если он молчит) — на него вешается внешний проб.
    # Без отдельного location путь уходит в SPA-фолбэк ниже и отвечает 200 с
    # index.html: остановка шедулера выглядела бы для мониторинга как норма
    location = /health/scheduler {
        proxy_pass http://backend:8000;
    }

    # service worker не должен кэшироваться — иначе PWA не обновится.
    # add_header в location стирает унаследованные заголовки — повторяем include
    location = /sw.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # SPA-роутинг
    location / {
        try_files $uri $uri/ /index.html;
    }
}
