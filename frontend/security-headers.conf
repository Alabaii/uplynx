# Security-заголовки прод-фронтенда. Подключается include-ом и в server, и в
# location /sw.js: add_header в location ПЕРЕЗАПИСЫВАЕТ все унаследованные
# add_header (классическая ловушка nginx), поэтому общий набор вынесен в файл.
#
# CSP дублирует meta-тег из index.html (он остаётся для dev-сервера), но строже:
# connect-src только 'self' (в проде API same-origin через /api), плюс
# frame-ancestors — в meta-теге браузеры его игнорируют, работает только заголовком.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# HSTS действует только когда сайт отдан по HTTPS (TLS терминируется внешним
# прокси/балансировщиком перед этим nginx); по plain-http браузеры его игнорируют
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
